name: Release

# Publishes the Windows installer + latest.yml on GitHub Releases (the auto-updater reads them):
# - push a tag "vX.Y.Z" matching apps/desktop/package.json, or
# - push a commit whose message contains "[release]": the tag vX.Y.Z is created on that commit.
on:
  push:
    tags: ['v*']
    branches: ['**']

permissions:
  contents: write

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check the version and create the tag
        shell: bash
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($version)"
              exit 1
            fi
          else
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "$version already exists: bump apps/desktop/package.json first"
              exit 1
            fi
            git tag "$version" "$GITHUB_SHA"
            git push origin "$version"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Build and publish
        run: pnpm --filter @toktok/desktop exec electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
