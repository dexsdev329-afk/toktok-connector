name: Release

# Publishes the Windows installer + latest.yml on GitHub Releases (the auto-updater reads them):
# - push a tag "vX.Y.Z" matching apps/desktop/package.json, or
# - push a commit whose message contains "[release]": the tag vX.Y.Z is created on that commit.
on:
  push:
    tags: ['v*']
    branches: ['**']

permissions:
  contents: write

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check the version and create the tag
        shell: bash
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($version)"
              exit 1
            fi
          else
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "$version already exists: bump apps/desktop/package.json first"
              exit 1
            fi
            git tag "$version" "$GITHUB_SHA"
            git push origin "$version"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # electron-builder uploads files in parallel: when no release exists yet, several uploads
      # can each create one (duplicate releases). Create the draft first, publish it at the end.
      - name: Create the draft release
        shell: bash
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          gh release view "$version" >/dev/null 2>&1 || gh release create "$version" --draft --title "${version#v}" --notes "TokTok Game Connector Live ${version#v}" --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and upload
        run: pnpm --filter @toktok/desktop exec electron-builder --win --x64 --publish always -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the release
        shell: bash
        run: gh release edit "$VERSION" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
